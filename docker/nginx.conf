worker_processes  1;
error_log  /dev/stderr  warn;
pid        /tmp/patrol-nginx.pid;

events {
    worker_connections  1024;
}

http {
    access_log  off;

    server {
        listen       9090;
        server_name  localhost;

        location /health {
            default_type text/plain;
            return 200 "OK\n";
        }

        location /status {
            stub_status on;
        }

        # 兜底路由：容器没起应用端口时也能确认 nginx 在跑
        location / {
            default_type text/plain;
            return 200 "vision-patrol sidecar nginx\n";
        }
    }
}
